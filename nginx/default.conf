events {
    worker_connections 1024;
}

http {
    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Upstream definition with health checks
    upstream rails_cluster {
        server rails1:3000 fail_timeout=10s max_fails=3;
        server rails2:3000 fail_timeout=10s max_fails=3;
        server rails3:3000 fail_timeout=10s max_fails=3;
    }

    # App server
    server {
        listen 80;
        server_name app.localhost;

        location / {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://rails_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Grafana server (protected)
    server {
        listen 80;
        server_name grafana.localhost;
        
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
        }
    }

    # Prometheus server (protected)
    server {
        listen 80;
        server_name prometheus.localhost;
        
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://prometheus:9090;
            proxy_set_header Host $host;
        }
    }

    # Metrics endpoint for Prometheus to scrape
    server {
        listen 8888;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}