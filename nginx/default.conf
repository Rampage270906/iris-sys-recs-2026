events {
    worker_connections 1024;
}

http {
    # Rate limit by IP — 2 requests/sec with a burst of 5
    # Anything beyond that gets a 503 immediately (nodelay)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=2r/s;

    # The 3 Rails replicas — NGINX round-robins across them
    # If a server fails 3 times in 10s it gets marked down temporarily
    upstream rails_cluster {
        server rails1:3000 fail_timeout=10s max_fails=3;
        server rails2:3000 fail_timeout=10s max_fails=3;
        server rails3:3000 fail_timeout=10s max_fails=3;
    }

    # Main app — hit app.localhost:8081 to reach the Rails app
    server {
        listen 80;
        server_name app.localhost;

        location / {
            limit_req zone=mylimit burst=5 nodelay;
            proxy_pass http://rails_cluster;
            # Pass real client IP through to Rails
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Grafana — behind basic auth so it's not open to everyone
    # Access at grafana.localhost:8081 (credentials in .htpasswd)
    server {
        listen 80;
        server_name grafana.localhost;

        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
        }
    }

    # Prometheus — same auth protection as Grafana
    # Access at prometheus.localhost:8081
    server {
        listen 80;
        server_name prometheus.localhost;

        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://prometheus:9090;
            proxy_set_header Host $host;
        }
    }

    # Internal metrics endpoint for nginx-prometheus-exporter
    # Runs on a separate port so it never leaks through the public :80 servers
    server {
        listen 8888;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}