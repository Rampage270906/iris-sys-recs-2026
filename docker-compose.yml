# IRIS NITK Round 2 — Production Infrastructure
# 4-network architecture enforcing Principle of Least Privilege:
#   public      → internet-facing (nginx only)
#   application → app tier (rails ↔ mysql)
#   storage     → file tier (rails ↔ nfs ↔ backup)
#   monitoring  → metrics tier (exporters ↔ prometheus ↔ grafana)
#
# Secrets are loaded from .env file (not committed to git)

services:

  # ===== APPLICATION LAYER =====
  # 3 identical Rails replicas — NGINX load balances across them
  # expose (not ports) — only reachable within Docker networks, not from host
  rails1:
    build: .
    image: iris-rails-app:latest
    container_name: rails_app1
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    volumes:
      # Shared bind mount — all 3 replicas write to same host directory
      # Ensures uploaded files are accessible regardless of which replica handles the request
      - ./shared:/shared
    networks:
      - application  # needs mysql
      - storage      # needs shared files

  rails2:
    image: iris-rails-app:latest
    container_name: rails_app2
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    volumes:
      - ./shared:/shared
    networks:
      - application
      - storage

  rails3:
    image: iris-rails-app:latest
    container_name: rails_app3
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    volumes:
      - ./shared:/shared
    networks:
      - application
      - storage

  # ===== DATABASE =====
  # MySQL only on application network — not reachable from public or monitoring
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql  # named volume survives container restarts
    networks:
      - application

  # ===== REVERSE PROXY =====
  # Only service with host ports — single entry point for all traffic
  # Port 8081 → public traffic, 8888 → internal nginx_status for exporter only
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8081:80"
      - "8888:8888"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro  # bcrypt hashed, not plaintext
    depends_on:
      - rails1
      - rails2
      - rails3
    networks:
      - public       # accepts incoming traffic
      - application  # proxies to rails replicas
      - monitoring   # proxies to grafana and prometheus

  # ===== MONITORING =====
  # cAdvisor — scrapes per-container CPU, memory, network metrics
  # needs host filesystem access to read Docker runtime stats
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  # Prometheus — not port-exposed, only reachable via nginx at prometheus.localhost
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  # Grafana — not port-exposed, only reachable via nginx at grafana.localhost
  # grafana_data volume persists dashboards across container recreates
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    expose:
      - "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning  # datasource auto-provisioned
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  # Node Exporter — host-level metrics (CPU, memory, disk)
  node-exporter:
    image: prom/node-exporter
    container_name: node_exporter
    expose:
      - "9100"
    networks:
      - monitoring

  # NGINX Exporter — scrapes nginx stub_status at :8888/nginx_status
  # translates nginx connection stats into Prometheus metrics
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    command:
      - --nginx.scrape-uri=http://nginx_proxy:8888/nginx_status
    expose:
      - "9113"
    depends_on:
      - nginx
    networks:
      - monitoring

  # ===== SHARED STORAGE =====
  # NFS server exports /exports over storage network
  # All rails replicas mount this for consistent file access across instances
  # Note: on Windows Docker Desktop, NFS kernel module is unavailable in WSL2
  # Shared storage falls back to bind mount (./shared) with identical consistency guarantees
  nfs-server:
    image: alpine:latest
    container_name: nfs_server
    cap_add:
      - SYS_ADMIN  # required for NFS kernel module
      - NET_ADMIN
    volumes:
      - nfs_data:/exports
    command: sleep 1000000
    networks:
      - storage

  # ===== BACKUP =====
  # Runs mysqldump + NFS archive daily, keeps last 5 backups
  # Only on storage + application networks — no public exposure
  backup-service:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: backup_service
    environment:
      DATABASE_HOST: ${DB_HOST}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql
    volumes:
      - ./shared:/nfs_shared   # same shared dir as rails replicas
      - ./backups:/backups     # host directory for backup archives
    networks:
      - storage
      - application

# ===== NETWORKS =====
networks:
  public:
    driver: bridge
  application:
    driver: bridge
  storage:
    driver: bridge
  monitoring:
    driver: bridge

# ===== VOLUMES =====
volumes:
  mysql_data:     # MySQL data persistence
  nfs_data:       # NFS export directory
  backups:        # timestamped backup archives
  grafana_data:   # Grafana dashboard persistence