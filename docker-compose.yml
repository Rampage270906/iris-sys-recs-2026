services:
  rails:
    build: .
    image: iris-rails-app:latest   
    container_name: rails_app
    expose:
      - "3000"                  
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8081:80"          # Only this is exposed to host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rails
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
