services:
  rails1:
    build: .
    image: iris-rails-app:latest
    container_name: rails_app1
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    networks:
      - backend

  rails2:
    image: iris-rails-app:latest
    container_name: rails_app2
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    networks:
      - backend

  rails3:
    image: iris-rails-app:latest
    container_name: rails_app3
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rails1
      - rails2
      - rails3
    networks:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend

  grafana:   
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
