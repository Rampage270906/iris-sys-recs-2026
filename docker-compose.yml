# 4-network architecture with shared storage and automated backups
# Each service only connects to networks it strictly needs
services:
# ===== APPLICATION LAYER =====
  rails1:
    build: .
    image: iris-rails-app:latest
    container_name: rails_app1
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    volumes:
      - C:\Users\sidda\OneDrive\Desktop\IRIS_System\iris-sys-recs-2026\shared:/shared
    networks:
      - application
      - storage

  rails2:
    image: iris-rails-app:latest
    container_name: rails_app2
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    volumes:
      - C:\Users\sidda\OneDrive\Desktop\IRIS_System\iris-sys-recs-2026\shared:/shared
    networks:
      - application
      - storage

  rails3:
    image: iris-rails-app:latest
    container_name: rails_app3
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    volumes:
      - C:\Users\sidda\OneDrive\Desktop\IRIS_System\iris-sys-recs-2026\shared:/shared
    networks:
      - application
      - storage

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - application

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8081:80"
      - "8888:8888"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - rails1
      - rails2
      - rails3
    networks:
      - public
      - application
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    expose:
      - "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  nfs-server:
    image: alpine:latest
    container_name: nfs_server
    networks:
      - storage
    volumes:
      - nfs_data:/exports
    command: sleep 1000000
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  node-exporter:
    image: prom/node-exporter
    container_name: node_exporter
    expose:
      - "9100"
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    command:
      - --nginx.scrape-uri=http://nginx_proxy:8888/nginx_status
    expose:
      - "9113"
    depends_on:
      - nginx
    networks:
      - monitoring

  backup-service:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: backup_service
    networks:
      - storage
      - application
    volumes:
      - /c/Users/sidda/OneDrive/Desktop/IRIS_System/iris-sys-recs-2026/shared:/nfs_shared
      - /c/Users/sidda/OneDrive/Desktop/IRIS_System/iris-sys-recs-2026/backups:/backups
    environment:
      DATABASE_HOST: mysql
      DATABASE_USER: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql

networks:
  public:
    driver: bridge
  application:
    driver: bridge
  storage:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  mysql_data:
  nfs_data:
  backups:
  grafana_data: