# IRIS Round 2 - Production Infrastructure
# 4-network architecture with shared storage and automated backups
# Each service only connects to networks it strictly needs
services:
# ===== APPLICATION LAYER =====
# 3 Rails replicas for load balancing
# Connected to: application (database), storage (NFS files)
  rails1:
    build: .
    image: iris-rails-app:latest
    container_name: rails_app1
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    volumes:
      - nfs_data:/shared
    networks:
      - application
      - storage

  rails2:
    image: iris-rails-app:latest
    container_name: rails_app2
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    volumes:
      - nfs_data:/shared
    networks:
      - application
      - storage

  rails3:
    image: iris-rails-app:latest
    container_name: rails_app3
    expose:
      - "3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: appdb
      DATABASE_USERNAME: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
    volumes:
      - nfs_data:/shared
    networks:
      - application
      - storage

# MySQL database
# Only accessible from application network (rails apps only)
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - application

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - rails1
      - rails2
      - rails3
    networks:
      - public
      - application

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:   
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring

# NFS Server for shared file storage
# All 3 rails replicas mount this at /shared
  nfs-server:
    image: itsthenetwork/nfs-server:alpine
    container_name: nfs_server
    networks: 
      - storage
    volumes:
      - nfs_data:/exports
    environment:
      SHARED_DIRECTORY: /exports
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
  
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    expose:
      - "9100"
    networks:
      - monitoring
  
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: nginx_exporter
    expose:
      - "9113"
    networks:
      - monitoring
    command:
      - -nginx.scrape-uri=http://nginx:8888/nginx_status
  
  backup-service:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: backup_service
    networks:
      - storage
      - application
    volumes:
      - nfs_data:/nfs_shared
      - backups:/backups
    environment:
      DATABASE_HOST: mysql
      DATABASE_USER: appuser
      DATABASE_PASSWORD: apppassword
    depends_on:
      - mysql
      
# ===== NETWORKS =====
# 4 separate networks following Principle of Least Privilege
networks:
  public:
    driver: bridge
  application:
    driver: bridge
  storage:
    driver: bridge
  monitoring:
    driver: bridge
volumes:
  mysql_data:
  nfs_data:
  backups:
